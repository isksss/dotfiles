min_version = "2026.7.5"

[settings]
dotfiles.root = "~/dotfiles/dotfiles"
dotfiles.default_mode = "symlink"
minimum_release_age = "0h"

[tools]
# shell / cli
"aqua:eza-community/eza" = "latest"
atuin = "latest"
bat = "latest"
delta = "latest"
fzf = "latest"
ghq = "latest"
jq = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "latest"
ripgrep = "latest"
starship = "latest"
tree-sitter = "latest"
"usage" = "latest"
yazi = "latest"
zellij = "latest"
zoxide = "latest"

# shell enhancement
"cargo:sheldon" = "latest"
shfmt = "latest"

# vcs / forge
glab = { version = "latest", exe = "glab" }

# runtimes
deno = "latest"
go = "latest"
java = "temurin-25"
node = "24"
python = "latest"
uv = "latest"
"pipx:graphifyy" = { version = "0.9.47", extras = "terraform" }

# go tools
"go:github.com/d-kuro/gwq/cmd/gwq" = "latest"
"go:github.com/isksss/sqio/cmd/sqio" = "latest"

# npm tools
"npm:@antfu/ni" = "latest"
"npm:@github/copilot" = "latest"
"npm:@openai/codex" = "latest"
"npm:playwright" = "latest"

# alt shell
"aqua:nushell/nushell" = "latest"
rust = "latest"
gh = "latest"
"npm:@marp-team/marp-cli" = "latest"
terraform = "latest"
"github:ogulcancelik/herdr" = "latest"
pnpm = "latest"
cloudflared = "latest"
"npm:@devcontainers/cli" = "latest"
"aqua:jorgerojas26/lazysql" = "latest"
"npm:@officecli/officecli" = "latest"
"npm:@rivolink/leaf" = "latest"
"cargo:isksss/isksh" = "latest"
"github:anomalyco/opencode" = "latest"
claude = "latest"
aws = { version = "latest", symlink_bins = "true" }
rtk = "latest"
"npm:@nulab/bee" = "latest"
llmfit = "latest"
"llama.cpp" = { version = "latest", prerelease = true, version_prefix = "b" }
pi = "latest"

[tasks.llama-pi-server]
description = "Start the llama.cpp router for pi"
run = "llama-server --models-dir \"${XDG_CACHE_HOME:-$HOME/.cache}/llmfit/models\" --models-autoload --models-max 1 --jinja --host 127.0.0.1 --port 8080 --ctx-size 32768"

[dotfiles]
"~/.bashrc" = {}
"~/.vimrc" = {}
"~/.zshenv" = {}
"~/.local/bin/update" = {}
"~/.copilot/mcp-config.json" = {}
"~/.config/Code/User" = {}
"~/.config/alacritty" = {}
"~/.config/atuin" = {}
"~/.config/ghq" = {}
"~/.config/git" = {}
"~/.config/gwq" = {}
"~/.config/herdr" = {}
"~/.config/lazygit" = {}
"~/.config/mise/config.toml" = "~/dotfiles/mise.toml"
"~/.config/nvim" = {}
"~/.config/nushell/config.nu" = {}
"~/.config/nushell/env.nu" = {}
"~/.config/ollama" = {}
"~/.config/opencode" = {}
"~/.pi/agent/settings.json" = {}
"~/.config/sheldon" = {}
"~/.config/starship.toml" = {}
"~/.config/tmux" = {}
"~/.config/yazi" = {}
"~/.config/zellij" = {}
"~/.config/zsh" = {}
"~/.wallpapers" = {}
"~/.agents/AGENTS.md" = "~/dotfiles/.agents/AGENTS.md"
"~/.claude/CLAUDE.md" = "~/dotfiles/.agents/AGENTS.md"
"~/.codex/AGENTS.md" = "~/dotfiles/.agents/AGENTS.md"
"~/.copilot/copilot-instructions.md" = "~/dotfiles/.agents/AGENTS.md"
[shell_alias]

[env]
EDITOR = "nvim"
LANG = "ja_JP.UTF-8"
LC_ALL = "ja_JP.UTF-8"
PAGER = "bat"

STARSHIP_CONFIG = "{{env.XDG_CONFIG_HOME}}/starship.toml"

XDG_CACHE_HOME = "{{env.HOME}}/.cache"
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
XDG_DATA_HOME = "{{env.HOME}}/.local/share"
XDG_STATE_HOME = "{{env.HOME}}/.local/state"

LLAMA_BASE_URL = "http://127.0.0.1:8080"
