id = "local.gwq-worktree"
name = "GWQ Worktree"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Create Herdr worktrees through gwq"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Create worktree with gwq"
